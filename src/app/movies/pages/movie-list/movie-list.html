<h1 class="text-5xl sm:text-2xl md:text-3xl lg:text-5xl font-bold mb-4 w-auto">
  Películas mejor valoradas
</h1>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
  @let movies = moviesResource.value() ?? [];
  @for (movie of movies ?? []; track movie.id) {
    <app-movie-item-list [movie]="movie" />
  } @empty {
    @for (item of "items".repeat(5); track $index) {
      <app-movie-item-skeleton-list />
    }
  }
</div>


<app-pagination [pages]="10"
  [currentPage]="paginationService.currentPage()" />
