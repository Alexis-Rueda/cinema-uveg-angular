<h1 class="text-5xl sm:text-2xl md:text-3xl lg:text-5xl font-bold mb-4 w-auto">Películas mejor valoradas</h1>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

  @if (moviesResource.value()) {
  @for (movie of moviesResource?.value() ?? []; track movie.id) {
  <div
    class="card card-side bg-base-100 shadow-sm hover:shadow-lg transition-shadow duration-300 cursor-pointer transform hover:scale-105"
    routerLink="/movies/{{movie.id}}">
    <figure>
      @if (movie?.backdrop_path) {
      <img [src]="`https://image.tmdb.org/t/p/w500/${movie.backdrop_path}`" alt="Movie" />
      } @else {
      <div class="skeleton h-70 w-full"></div>
      }
    </figure>

    <div class="card-body w-full">
      <h2 class="card-title w-full h-25 overflow-hidden">{{movie.title}}</h2>
      <div class="stats ">
        <div class="stat">
          <div class="stat-title">Popularidad</div>
          <div class="stat-value">{{movie.popularity | number:'1.0-2' }}</div>
          <div class="stat-desc">{{movie.release_date | date}}</div>
        </div>
      </div>
    </div>
  </div>
  }

  } @else {
  @for (item of "items".repeat(5); track $index) {
  <div class="card card-side bg-base-100">
    <div class="skeleton h-70 w-full"></div>

    <div class="card-body w-full">
      <div class="skeleton h-4 w-full"></div>
      <div class="skeleton h-4 w-full"></div>
      <!-- <div class="skeleton h-4 w-28"></div> -->

      <div class="flex flex-col gap-4 mt-2">
        <div class="skeleton h-4 w-28"></div>
        <div class="skeleton h-16 w-16 shrink-0 rounded-full"></div>
        <div class="skeleton h-4 w-28"></div>
      </div>
    </div>
  </div>
  }
  }
</div>


<app-pagination [pages]="10" [currentPage]="paginationService.currentPage()" />
