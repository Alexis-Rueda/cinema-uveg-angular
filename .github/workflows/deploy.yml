name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Paso para generar el archivo de environment en el runner
      - name: Create environment file
        run: |
          mkdir -p src/environments
          cat <<EOF > src/environments/environment.prod.ts
          export const environment = {
            production: true,
            API_URL: '${{ secrets.API_KEY }}',
            API_KEY: '${{ secrets.API_URL }}'
          };
          EOF

      - run: npx ng build --configuration production --base-href /cinema-uveg-angular/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cinema-uveg/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
